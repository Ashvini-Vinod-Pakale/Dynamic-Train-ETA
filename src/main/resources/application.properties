spring.application.name=backend

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/train_eta}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# RailRadar API Configuration
# ===============================
railradar.base-url=https://api.railradar.in
railradar.api-key=${RAILRADAR_API_KEY:}

# ===============================
# Monitored Real Train Fleet & Polling
# ===============================
railradar.monitored-trains=${RAILRADAR_MONITORED_TRAINS:12123,11007,11009,12125,22105,11012}
railradar.poll-interval-ms=${RAILRADAR_POLL_INTERVAL_MS:60000}
railradar.stagger-interval-ms=${RAILRADAR_STAGGER_INTERVAL_MS:1000}
railradar.cache-ttl-ms=${RAILRADAR_CACHE_TTL_MS:90000}

# ===============================
# Simulation Configuration (Isolated)
# ===============================
simulation.websocket.topic=/topic/simulation-status
